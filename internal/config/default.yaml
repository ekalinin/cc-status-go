# Built-in default configuration for cc-status.
# Override by placing your own file at ~/.config/cc-status/config.yaml
# or pointing CC_STATUS_CONFIG / --config at it.
#
# Each segment's `type` provides smart defaults for template/when/style/symbol;
# set any of those here to override them. `symbol` sets a segment's leading glyph
# without restating its template and works on every type, e.g. `symbol: "$"` on
# cost, `symbol: "⏳"` on rate_limit, or `symbol: {branch: "⎇"}` on git.

separator: " | "
no_color: false

segments:
  - type: model
  - type: cwd
  - type: git
  - type: context_full
  - type: cost
  - type: rate_limit_full
  - type: vim
  - type: agent
  - type: pr_full
  - type: sessions_full
